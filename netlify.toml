# On every deploy, copy the site's .html file to dist/index.html,
# so a file named "index (9).html" (or anything else) still becomes the homepage.
# Keep only ONE .html file in the repo, or the first one alphabetically is used.
# Images in the repo root (like og-image.png, the link-preview picture) are published too.
[build]
  command = "mkdir -p dist && f=$(ls *.html | head -n 1) && cp \"$f\" dist/index.html && (cp *.png *.jpg *.ico dist/ 2>/dev/null || true) && echo \"Published $f as index.html\""
  publish = "dist"
